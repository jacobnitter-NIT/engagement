name: Autonord People checks
on:
  push:
    paths: ['portal-v2/**', '.github/workflows/autonord-people-checks.yml']
  pull_request:
    paths: ['portal-v2/**', '.github/workflows/autonord-people-checks.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
